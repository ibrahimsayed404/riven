version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: riven_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riven
      POSTGRES_PASSWORD: riven_dev_password
      POSTGRES_DB: riven
    ports:
      # Host 5433 avoids colliding with a local Postgres install on the default 5432.
      - "5433:5432"
    volumes:
      - riven_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riven -d riven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: riven_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - riven_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: riven_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: riven_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - riven_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev. Production points the same
  # S3_* env vars at R2/S3 — no code change.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: riven_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: riven
      MINIO_ROOT_PASSWORD: riven_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - riven_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket and allow anonymous *download* so
  # publicUrl works without signing. Uploads still require a presigned PUT.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: riven_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 riven riven_dev_password &&
        mc mb --ignore-existing local/riven-media &&
        mc anonymous set download local/riven-media
      "

volumes:
  riven_postgres_data:
  riven_redis_data:
  riven_meili_data:
  riven_minio_data:
